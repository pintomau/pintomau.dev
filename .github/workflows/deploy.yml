name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build site with Zola
        shell: bash
        # language=bash
        run: |
          image="ghcr.io/getzola/zola:v0.22.1"
          echo "Using image: $image"
          
          docker run --rm \
             -v "${{ github.workspace }}":/workspace \
             -w "/workspace/" \
             "$image" check
          
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -w "/workspace/" \
            "$image" build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
